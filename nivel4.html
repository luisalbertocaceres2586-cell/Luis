<style>
html,body{margin:0;height:100%;background:#04050c;color:#fff;font-family:"Trebuchet MS",Verdana,ui-sans-serif,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;gap:24px}
aside{width:min(24vw,260px);color:#d7d4ee;font-size:14px;line-height:1.5;display:none}
aside h2{color:#ffe27a;margin:0 0 8px;font-size:18px}
aside kbd{background:#ffffff1c;border:1px solid #ffffff44;border-radius:6px;padding:1px 7px}
@media (min-aspect-ratio:1/1) and (min-width:900px){aside{display:block}}
#marco{position:relative;overflow:hidden;background:#04050c;box-shadow:0 0 40px #000a;border-radius:6px}
#cv{display:block}
#ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u,1px)*16);padding:calc(var(--u,1px)*28);text-align:center;background:radial-gradient(ellipse at 50% 35%,#3a2a63ee,#090b24f2 75%)}
#ov h1{margin:0;color:#ffe27a;font-size:calc(var(--u,1px)*46);text-shadow:0 0 18px #ee9b56;line-height:1.1}
#ov p{margin:0;color:#e3e0f6;font-size:calc(var(--u,1px)*24);line-height:1.45}
#ov .ctl{font-size:calc(var(--u,1px)*20);color:#bdb8dd}
#ov .reglas{display:flex;flex-wrap:wrap;gap:calc(var(--u,1px)*8);justify-content:center}
#ov .reglas span{background:#ffffff14;border:1px solid #ffffff30;border-radius:calc(var(--u,1px)*14);padding:calc(var(--u,1px)*8) calc(var(--u,1px)*12);font-size:calc(var(--u,1px)*20)}
#ov .estrellas{font-size:calc(var(--u,1px)*70)}
#ov .estrellas .st{display:inline-block;animation:stPop .7s cubic-bezier(.2,1.7,.4,1) both;filter:drop-shadow(0 0 12px rgba(255,210,90,.85))}
#ov .estrellas .st0{display:inline-block;opacity:.22}
@keyframes stPop{0%{transform:scale(0) rotate(-140deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
#ov button{font:inherit;font-weight:bold;font-size:calc(var(--u,1px)*28);padding:calc(var(--u,1px)*14) calc(var(--u,1px)*38);border-radius:calc(var(--u,1px)*40);border:calc(var(--u,1px)*4) solid #ffc93c;background:linear-gradient(#3f78e0,#12307a);color:#fff;text-shadow:0 2px 0 #0a1c52;box-shadow:0 calc(var(--u,1px)*5) 0 #7a5200,0 0 calc(var(--u,1px)*22) #ffc93c66;cursor:pointer;transition:transform .12s}
#ov button:hover{transform:scale(1.05)}#ov button:active{transform:scale(.97)}
#ov button.sec{background:linear-gradient(#4a4466,#262040);border-color:#c9b86a;font-size:calc(var(--u,1px)*22);box-shadow:0 calc(var(--u,1px)*4) 0 #4b3e12}
.retrato{position:relative;width:calc(var(--u,1px)*150);height:calc(var(--u,1px)*150);flex:none;animation:flota 3s ease-in-out infinite}
.retrato .ret{position:absolute;left:14%;top:14%;width:72%;height:72%;border-radius:50%;object-fit:cover}
.retrato .mar{position:absolute;inset:0;width:100%;height:100%}
.barra{width:78%;height:auto;margin:calc(var(--u,1px)*-4) 0}
#ov .reglas img{height:calc(var(--u,1px)*26);vertical-align:middle;margin-right:calc(var(--u,1px)*6)}
@keyframes flota{50%{transform:translateY(calc(var(--u,1px)*-6))}}
#ov>*{animation:entra .5s both}#ov>*:nth-child(2){animation-delay:.08s}#ov>*:nth-child(3){animation-delay:.16s}#ov>*:nth-child(4){animation-delay:.24s}#ov>*:nth-child(5){animation-delay:.32s}
@keyframes entra{from{opacity:0;transform:translateY(calc(var(--u,1px)*16)) scale(.96)}to{opacity:1;transform:none}}
#bPausa,#bMudo{position:absolute;top:calc(var(--u,1px)*10);width:calc(var(--u,1px)*52);height:calc(var(--u,1px)*52);border-radius:50%;border:2px solid #ffffff66;background:#0f0828cc;color:#fff;font-size:calc(var(--u,1px)*26);cursor:pointer;padding:0;z-index:5}
#bPausa{border:0;background:url(assets/ui/hud/marcos/boton_pausa.webp) center/contain no-repeat}
#bPausa{right:calc(var(--u,1px)*10)}#bMudo{right:calc(var(--u,1px)*70)}
#girar{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px;background:#04050c}
#girar.on{display:flex}#girar h2{color:#ffe27a;margin:0;font-size:24px}#girar p{margin:0;color:#d7d4ee;max-width:360px}
#girar button{font:inherit;font-weight:bold;font-size:17px;padding:13px 22px;border-radius:14px;border:2px solid #ffe27a;background:#ffe27a;color:#1a0f3a;cursor:pointer;touch-action:manipulation;min-width:230px}
#girar button.sec{background:transparent;color:#d7d4ee;border-color:#ffffff55;font-size:14px;padding:10px 18px}
#girar .ios{font-size:13px;color:#9fb0ff;display:none}
#girar .tel{width:64px;height:110px;border:5px solid #ffe27a;border-radius:14px;animation:g 2.6s ease-in-out infinite}
@keyframes g{0%,20%{transform:rotate(-90deg)}55%,85%{transform:rotate(0)}100%{transform:rotate(-90deg)}}
</style>

<body>
<div id="app">
 <div id="marco"><canvas id="cv"></canvas></div>
</div>
<div id="girar"><div class="tel"></div><h2>GIRA TU TELÉFONO</h2><p>El Mundo Negativo se juega en <b>horizontal</b>.</p>
 <button id="girarAuto" type="button">🔄 Girar automáticamente</button>
 <p class="ios" id="girarIos">En iPhone: abre el Centro de control y apaga el candado de rotación 🔒.</p>
 <button id="girarAsi" type="button" class="sec">Jugar así de todos modos</button></div>
<script src="engine/nivel1/perfiles.js?v=8"></script>
<script src="assets/characters/sakura_assets/sakura/manifest.js?v=sk2"></script>
<script src="assets/characters/antarez/manifest.js?v=an2"></script>

<script>
(function(){
  var q=new URLSearchParams(location.search),perfil=null;
  try{perfil=q.get('perfil')?Perfiles.obtener(q.get('perfil')):Perfiles.activo();}catch(e){}
  var heroe=(perfil&&perfil.avatar)||q.get('heroe')||'sakura'; if(heroe!=='kage')heroe='sakura';
  // aviso "gira tu teléfono": solo en vertical y con pantalla táctil
  var asi=false,g=document.getElementById('girar');
  function vigila(){var t=false;try{t=matchMedia('(pointer:coarse)').matches;}catch(e){}g.classList.toggle('on',!asi&&t&&innerHeight>innerWidth&&innerWidth<640);}
  window.addEventListener('resize',vigila);document.addEventListener('ninja-orient',vigila);vigila();
  document.getElementById('girarAsi').onclick=function(){asi=true;vigila();};
  document.getElementById('girarAuto').onclick=function(){if(window.NinjaOrient)NinjaOrient.forzar('landscape');};
  var ios=document.getElementById('girarIos');if(ios&&window.NinjaOrient&&NinjaOrient.iOS){ios.style.display='block';document.getElementById('girarAuto').style.display='none';}
  window.__n4=Nivel4.iniciar({heroe:heroe,perfil:perfil||null,onSalir:function(){try{sessionStorage.setItem('ninja_abrir_mundos','1');}catch(e){}location.href='index.html?mundos=1';}});
})();
</script></body></html>
