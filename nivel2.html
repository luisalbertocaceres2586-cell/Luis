<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#090b24">
  <title>Nivel 2 · El Desierto Nocturno</title>
  <style>
    html,body{margin:0;min-height:100%;background:#090b24;color:#fff;font-family:ui-monospace,monospace}
    #ini{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:20px;text-align:center;background:radial-gradient(ellipse at 50% 35%,#28204c,#090b24 72%)}
    h1{margin:0;color:#ffe27a;font-size:clamp(20px,5vw,36px);text-shadow:0 0 18px #ee9b56}
    p{max-width:560px;line-height:1.7;color:#d7d4ee}
    button{font:inherit;font-weight:bold;padding:14px 20px;border-radius:8px;border:1px solid #ffe27a;background:linear-gradient(#ffe27a,#ffad58);color:#281532;cursor:pointer;box-shadow:0 0 20px #ec995866}
  </style>
</head>
<body>
  <main id="ini">
    <h1>EL DESIERTO NOCTURNO</h1>
    <p>El viaje continúa. Enfréntate a enemigos más rápidos y demuestra tu dominio de las tablas del 4, 5 y 6.</p>
    <button id="go" type="button">▶ ENTRAR AL NIVEL 2</button>
  </main>
  <script src="engine/nivel1/perfiles.js?v=8"></script>
  <script src="engine/nivel1/ruta.js?v=8"></script>
  <script src="engine/nivel1/acertijos.js?v=8"></script>
  <script src="engine/nivel1/gen-nivel.js?v=8"></script>
  <script src="engine/nivel1/motor.js?v=8"></script>
  <script src="engine/nivel1/elementos.js?v=8"></script>
  <script src="engine/nivel1/habilidades.js?v=8"></script>
  <script src="engine/nivel1/director.js?v=8"></script>
  <script>
    (function () {
      const q = new URLSearchParams(location.search);
      function arrancar() {
        const perfil = q.get('perfil') ? Perfiles.obtener(q.get('perfil')) : Perfiles.activo();
        document.getElementById('ini').remove();
        Nivel1.iniciar({
          nivel2: true,
          heroe: (perfil && perfil.avatar) || q.get('heroe') || 'sakura',
          dispositivo: (perfil && perfil.dispositivo) || q.get('dispositivo') || 'pc',
          perfil: perfil || null,
          semilla: q.get('semilla') ? +q.get('semilla') : undefined,
          habilidades: ['dash', 'doble', 'planeo', 'pared', 'tajoAereo', 'gancho'],
          onSalir: function () { location.href = 'index.html'; }
        });
      }
      document.getElementById('go').addEventListener('click', arrancar);
    })();
  </script>
</body>
</html>
