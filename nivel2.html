<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#090b24"><title>Nivel 2 · Surf de Dunas</title>
<style>
html,body{margin:0;height:100%;background:#090b24;color:#fff;font-family:ui-monospace,monospace}
#ini{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:20px;text-align:center;background:radial-gradient(ellipse at 50% 35%,#3a2a63,#090b24 72%)}
h1{margin:0;color:#ffe27a;font-size:clamp(22px,5vw,38px);text-shadow:0 0 18px #ee9b56}
p{max-width:560px;line-height:1.7;color:#d7d4ee;margin:0}
button{font:inherit;font-weight:bold;padding:14px 22px;border-radius:8px;border:1px solid #ffe27a;background:linear-gradient(#ffe27a,#ffad58);color:#281532;cursor:pointer}
</style></head><body>
<main id="ini">
<h1>SURF DE DUNAS</h1>
<p>Desliza por el desierto de noche. Cambia de carril y cruza la compuerta que tiene la respuesta correcta de las tablas del 4, 5 y 6. Esquiva cactus, rocas y escorpiones, y al final enfrenta al Escorpión Colosal.</p>
<p>PC: ↑ ↓ cambian de carril · ESPACIO salta. Celular: botones en pantalla.</p>
<button id="go" type="button">▶ ENTRAR AL NIVEL 2</button>
</main>
<script src="engine/nivel1/perfiles.js?v=8"></script>
<script src="engine/nivel2/surf.js?v=3"></script>
<script>
document.getElementById('go').addEventListener('click',function(){
  var q=new URLSearchParams(location.search),perfil=null;
  try{perfil=q.get('perfil')?Perfiles.obtener(q.get('perfil')):Perfiles.activo();}catch(e){}
  document.getElementById('ini').remove();
  Nivel2.iniciar({heroe:(perfil&&perfil.avatar)||q.get('heroe')||'sakura',perfil:perfil||null,onSalir:function(){location.href='index.html';}});
});
</script></body></html>
