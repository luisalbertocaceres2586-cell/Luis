name: Asistente de avances

# PAUSADO (noviembre 2026): ya NO se despierta solo. Antes se activaba al subir cualquier rama y cada 2 horas sobre TODAS las ramas:
# escribía commits en tus ramas, las fusionaba con squash y las borraba, lo que desincronizaba las copias locales («no me deja hacer pull»)
# y dejaba atascado el trabajo cuando un chequeo fallaba. Ahora los cambios se suben con:  npm run subir   (ver docs/FLUJO_DE_TRABAJO.md).
# Para volver a activarlo: devuelve los bloques «push» y «schedule» (están en el historial de git) o ejecútalo a mano desde
# Actions → Asistente de avances → Run workflow. Guía del asistente: docs/ASISTENTE_PRS.md
on:
  workflow_dispatch:
    inputs:
      rama:
        description: 'Rama a procesar (vacío = todas las solicitudes abiertas)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: asistente-de-avances
  cancel-in-progress: false

jobs:
  asistente:
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}
      BOT_TOKEN_PRESENTE: ${{ secrets.BOT_TOKEN != '' && '1' || '' }}
      PRUEBAS_NAVEGADOR: ${{ vars.PRUEBAS_NAVEGADOR || '1' }}
      RAMA_PUSH: ${{ github.event_name == 'push' && github.ref_name || '' }}
      RAMA_MANUAL: ${{ github.event_name == 'workflow_dispatch' && inputs.rama || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Procesar avances
        run: bash tools/asistente-prs.sh "$RAMA_PUSH$RAMA_MANUAL"
