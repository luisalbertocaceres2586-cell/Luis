name: Optimizar imágenes

# 1) Pull Request que añade o cambia PNG en assets/  →  se comprimen SIN PÉRDIDA (los píxeles quedan idénticos, mismo nombre)
#    y el cambio se guarda en la misma rama del PR. Así las imágenes nuevas de ChatGPT no engordan el juego.
# 2) A mano (pestaña Actions → "Optimizar imágenes" → Run workflow): elige la rama, "usados" o "todo", y si permites pérdida controlada.
#    Úsalo en una rama de trabajo, no directo en main, y revisa el PR antes de fusionar.
on:
  pull_request:
    paths:
      - 'assets/**/*.png'
  workflow_dispatch:
    inputs:
      alcance:
        description: 'Qué imágenes'
        type: choice
        options: [usados, todo]
        default: usados
      con_perdida:
        description: 'Permitir reducir colores (pngquant, calidad mínima 85) además de la compresión sin pérdida'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  optimizar:
    # no se ejecuta en PR de forks (no tienen permiso de escritura) ni sobre los commits del propio robot
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar optimizadores
        run: sudo apt-get update -qq && sudo apt-get install -y -qq optipng pngquant
      - name: Optimizar
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node tools/optimizar_imagenes.js --cambiados "origin/${{ github.base_ref }}"
          else
            EXTRA=""
            if [ "${{ inputs.con_perdida }}" = "true" ]; then EXTRA="--lossy"; fi
            node tools/optimizar_imagenes.js --${{ inputs.alcance }} $EXTRA
          fi
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets
          if git diff --cached --quiet; then
            echo "Nada que comprimir."
          else
            git commit -m "Imágenes optimizadas automáticamente [skip ci]"
            git pull --rebase origin "${{ github.event.pull_request.head.ref || github.ref_name }}"
            git push origin HEAD
          fi
