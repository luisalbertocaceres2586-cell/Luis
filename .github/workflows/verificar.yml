name: Verificar (tipos y pruebas)

# Se ejecuta en cada Pull Request y en cada push a main.
# Si algo falla, GitHub muestra una ✗ roja ANTES de publicar el juego.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Revisión de tipos (TypeScript)
        run: npm run typecheck
      - name: Pruebas
        run: npm test
