name: Fusionar automáticamente

# Robot de fusión. Cuando una pestaña/sesión abre un Pull Request, el robot:
#   1) lo pone al día con main (resolviendo solo version.json y las líneas <script>/<link> repetidas de los .html),
#   2) corre las mismas comprobaciones que "Verificar" (tipos + pruebas) sobre el resultado ya unido,
#   3) si todo pasa, lo FUSIONA y borra la rama. Si algo no se puede resolver solo, NO lo fusiona: lo marca con la etiqueta
#      "necesita-revision" y deja un comentario explicando qué pasó.
# Se vuelve a intentar cuando: se abre/actualiza un PR, entra algo a main, o cada 30 minutos (red de seguridad).
# Para que el robot NO toque un PR: ponle la etiqueta "no-fusionar" o ábrelo como borrador (draft).
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
    paths-ignore:
      - version.json
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

# un solo robot a la vez: los PR se van fusionando de uno en uno, cada uno sobre el main más reciente
concurrency:
  group: auto-fusionar
  cancel-in-progress: false

jobs:
  fusionar:
    # no se reacciona a lo que hace el propio robot de versión
    if: github.actor != 'github-actions[bot]' || github.event_name != 'push'
    runs-on: ubuntu-latest
    env:
      # Recomendado: guarda un token personal en Settings → Secrets → Actions con el nombre AUTO_TOKEN (permisos Contents y Pull requests: lectura y escritura).
      # Con él, lo que fusiona el robot dispara normalmente la publicación de la versión y de GitHub Pages. Sin él, funciona igual con la llave normal.
      GH_TOKEN: ${{ secrets.AUTO_TOKEN || github.token }}
      HAY_PAT: ${{ secrets.AUTO_TOKEN && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTO_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fusionar los Pull Requests que estén listos
        run: bash tools/fusionar-todo.sh "${{ github.event.pull_request.number }}"
